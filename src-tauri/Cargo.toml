[package]
name = "http-inspector"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "http_inspector_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
inspector-core = { path = "../crates/inspector-core" }
inspector-project-integration = { path = "../crates/inspector-project-integration" }
inspector-server = { path = "../crates/inspector-server" }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11", features = [] }
tokio = { version = "1.50", features = ["sync"] }
